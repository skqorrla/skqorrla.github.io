{% assign post = include.post %}
<li class="post-card"
    data-category="{{ post.category | downcase }}"
    data-tags="{{ post.tags | join: ',' | downcase }}"
    data-title="{{ post.title | downcase | escape }}"
    data-summary="{{ post.subtitle | downcase | escape }}">
  <a class="post-card__wrapper" href="{{ post.url | relative_url }}">
    <div class="post-card__thumb">
      {% if post.image %}<img class="post-card__img" src="{{ post.image | relative_url }}" alt="" loading="lazy">{% endif %}
    </div>
    <div class="post-card__content">
      <div class="post-card__header">
        <span class="post-card__category">{{ post.category }}</span>
        <span class="post-card__date">{{ post.date | date: "%Y-%m-%d" }}</span>
      </div>
      <h2 class="post-card__title">{{ post.title }}</h2>
      <p class="post-card__sub">{{ post.subtitle }}</p>
      <div class="post-card__tags">
        {% for tag in post.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
      </div>
    </div>
  </a>
</li>
