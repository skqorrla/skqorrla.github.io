# Set theme
remote_theme: daviddarnes/alembic@main

# File excludes
exclude:
- README.md
- Gemfile
- Gemfile.lock

# Set plugins
plugins:
- jekyll-sitemap
- jekyll-mentions
- jekyll-paginate
- jekyll-seo-tag
- jekyll-redirect-from
- jekyll-feed
- jekyll-commonmark
- jekyll-include-cache
- jemoji
- jekyll-remote-theme

# Site settings
url: 'https://skqorrla.github.io/'
baseurl: ''
title: '잡동사니 지식 블로그'
description: '잡동사니 지식 블로그'
permalink: pretty
logo: "https://www.gravatar.com/avatar/6c0377abcf4da91cdd35dea4554b2a4c?s=52"
lang: ko

# Load custom fonts
# 본문/제목: Noto Sans KR (Google Fonts)
# 코드: D2Coding subset (한글 상용 글자 포함, full 버전은 3MB에 육박해 subset 사용)
fonts:
  preconnect_urls:
    - https://fonts.gstatic.com
    - https://cdn.jsdelivr.net
  font_urls:
    - https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap
    - https://cdn.jsdelivr.net/gh/wan2land/d2coding@master/d2coding-subset.css

# Pagination
paginate: 5
paginate_path: blog/page:num

# Header nav
navigation_header:
- title: Home
  url: /
- title: About
  url: /about/
- title: Blog
  url: /blog/

# Footer nav
navigation_footer:
- title: Back to top
  url: "#top"

# Collections
collections:
  posts:
    title: Posts
    output: true
    description: "My thoughts and ideas"
    feature_text: |
      Welcome to my blog
    feature_image: "https://picsum.photos/2560/600?image=866"

# Collection settings
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: post # Set the default layout for posts
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: page # Set the default layout for pages
