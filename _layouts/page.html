---
layout: default
---
<article class="page">
  <div class="wrapper">
    <header class="post__info">
      <h1 class="post__tit">{{ page.title }}</h1>
      {% if page.subtitle %}<h2 class="post__sub">{{ page.subtitle }}</h2>{% endif %}
    </header>
    <div class="post__content">
      {{ content }}
    </div>
  </div>
</article>
